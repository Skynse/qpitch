<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1428px" preserveAspectRatio="none" style="width:891px;height:1428px;background:#FFFFFF;" version="1.1" viewBox="0 0 891 1428" width="891px" zoomAndPan="magnify"><rect width="100%" height="100%" fill="#ffffff"/><title>QPitch 2.0 &#8212; audio and pitch-control paths</title><defs/><g><g class="title" data-source-line="2"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="297.4288" x="295.3126" y="34.9659">QPitch 2.0 &#8212; audio and pitch-control paths</text></g><ellipse cx="357.8378" cy="60.0679" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#E8F4F4" height="39.0679" rx="12.5" ry="12.5" style="stroke:#477678;stroke-width:0.5;" width="181.0554" x="267.3102" y="90.0679"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="161.0554" x="277.3102" y="115.0339">Host calls processBlock()</text><polygon fill="#E8F4F4" points="267.9512,149.1358,447.7245,149.1358,459.7245,161.1358,447.7245,173.1358,267.9512,173.1358,255.9512,161.1358,267.9512,149.1358" style="stroke:#477678;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="179.7733" x="267.9512" y="166.5678">Empty block or no outputs?</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="21.7419" x="459.7245" y="157.0339">yes</text><ellipse cx="503.4664" cy="161.1358" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="503.4664" cy="161.1358" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><rect fill="#E8F4F4" height="39.0679" rx="12.5" ry="12.5" style="stroke:#477678;stroke-width:0.5;" width="290.0309" x="212.8224" y="193.1358"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="270.0309" x="222.8224" y="218.1018">Read parameters and allowed-note mask</text><rect fill="#E8F4F4" height="39.0679" rx="12.5" ry="12.5" style="stroke:#477678;stroke-width:0.5;" width="237.0691" x="239.3033" y="252.2038"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="217.0691" x="249.3033" y="277.1697">Copy input channels to dryBuffer</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1;" width="695.6757" x="11" y="311.2717"/><rect fill="#E8F4F4" height="58.1358" rx="12.5" ry="12.5" style="stroke:#477678;stroke-width:0.5;" width="240.4711" x="78.2088" y="337.2717"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="220.4711" x="88.2088" y="362.2376">Detect pitch from input channel 0</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="136.1494" x="88.2088" y="381.3055">(YIN and confidence)</text><rect fill="#E8F4F4" height="58.1358" rx="12.5" ry="12.5" style="stroke:#477678;stroke-width:0.5;" width="303.6249" x="46.6319" y="415.4075"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="278.515" x="56.6319" y="440.3734">Convert Hz to MIDI; choose allowed target</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="283.6249" x="56.6319" y="459.4414">with note locking and transition smoothing</text><rect fill="#E8F4F4" height="58.1358" rx="12.5" ry="12.5" style="stroke:#477678;stroke-width:0.5;" width="350.8888" x="23" y="508.5433"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="330.8888" x="33" y="533.5093">Apply tolerance, correction amount, retune speed,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="219.6591" x="33" y="552.5772">snappiness, T-Pain and humanize</text><rect fill="#E8F4F4" height="58.1358" rx="12.5" ry="12.5" style="stroke:#477678;stroke-width:0.5;" width="238.0632" x="79.4128" y="586.6792"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="130.8015" x="89.4128" y="611.6451">Calculate pitch ratio</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="218.0632" x="89.4128" y="630.713">(or hold / relax after loss of pitch)</text><rect fill="#E8F4F4" height="39.0679" rx="12.5" ry="12.5" style="stroke:#477678;stroke-width:0.5;" width="290.7869" x="401.8888" y="471.5094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="270.7869" x="411.8888" y="496.4753">Retain original input for delayed dry path</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1;" width="695.6757" x="11" y="664.815"/><rect fill="#E8F4F4" height="58.1358" rx="12.5" ry="12.5" style="stroke:#477678;stroke-width:0.5;" width="296.4569" x="209.6094" y="690.815"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="276.4569" x="219.6094" y="715.7809">Feed all input channels to one PitchShifter</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="264.7809" x="219.6094" y="734.8489">with ratio = 1 when correction is inactive</text><rect fill="#E8F4F4" height="39.0679" rx="12.5" ry="12.5" style="stroke:#477678;stroke-width:0.5;" width="324.9609" x="195.3574" y="768.9508"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="304.9609" x="205.3574" y="793.9168">Adapt host blocks to fixed Rubber Band blocks</text><rect fill="#E8F4F4" height="58.1358" rx="12.5" ry="12.5" style="stroke:#477678;stroke-width:0.5;" width="249.2351" x="233.2203" y="828.0188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="153.2574" x="243.2203" y="852.9847">Shift channels together</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="229.2351" x="243.2203" y="872.0526">with selected native formant mode</text><path d="M549.0332,901.6206 L549.0332,931.2225 L529.0332,935.2225 L549.0332,939.2225 L549.0332,968.8244 A0,0 0 0 0 549.0332,968.8244 L879.054,968.8244 A0,0 0 0 0 879.054,968.8244 L879.054,911.6206 L869.054,901.6206 L549.0332,901.6206 A0,0 0 0 0 549.0332,901.6206" fill="#F3F9DB" style="stroke:#80934B;stroke-width:0.5;"/><path d="M869.054,901.6206 L869.054,911.6206 L879.054,911.6206 L869.054,901.6206" fill="#F3F9DB" style="stroke:#80934B;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="309.0208" x="555.0332" y="921.5866">Correction inactive: host bypass, correction off,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="296.2108" x="555.0332" y="940.6545">zero correction amount, or no allowed notes.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="275.6589" x="555.0332" y="959.7224">The engine keeps running in either mode.</text><rect fill="#E8F4F4" height="58.1358" rx="12.5" ry="12.5" style="stroke:#477678;stroke-width:0.5;" width="342.3907" x="186.6425" y="906.1546"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="322.3907" x="196.6425" y="931.1205">Crossfade shifted audio and latency-matched dry</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="200.7312" x="196.6425" y="950.1884">(5 ms fade; wet target = 1 or 0)</text><rect fill="#E8F4F4" height="39.0679" rx="12.5" ry="12.5" style="stroke:#477678;stroke-width:0.5;" width="346.4788" x="184.5984" y="988.8244"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="326.4788" x="194.5984" y="1013.7903">Duplicate mono output for mono-to-stereo layout</text><rect fill="#E8F4F4" height="39.0679" rx="12.5" ry="12.5" style="stroke:#477678;stroke-width:0.5;" width="320.5089" x="197.5834" y="1047.8923"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="300.5089" x="207.5834" y="1072.8582">Detect measured output pitch from channel 0</text><rect fill="#E8F4F4" height="39.0679" rx="12.5" ry="12.5" style="stroke:#477678;stroke-width:0.5;" width="330.0148" x="192.8304" y="1106.9602"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="310.0148" x="202.8304" y="1131.9261">Publish input, target and output pitch readouts</text><rect fill="#E8F4F4" height="39.0679" rx="12.5" ry="12.5" style="stroke:#477678;stroke-width:0.5;" width="137.4176" x="289.1291" y="1166.0281"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="117.4176" x="299.1291" y="1190.9941">Apply output gain</text><rect fill="#E8F4F4" height="39.0679" rx="12.5" ry="12.5" style="stroke:#477678;stroke-width:0.5;" width="155.2675" x="280.2041" y="1225.096"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="135.2675" x="290.2041" y="1250.062">Return audio to host</text><ellipse cx="357.8378" cy="1295.164" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="357.8378" cy="1295.164" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#46565D;stroke-width:1;" x1="357.8378" x2="357.8378" y1="70.0679" y2="90.0679"/><polygon fill="#46565D" points="353.8378,80.0679,357.8378,90.0679,361.8378,80.0679,357.8378,84.0679" style="stroke:#46565D;stroke-width:1;"/><line style="stroke:#46565D;stroke-width:1;" x1="357.8378" x2="357.8378" y1="173.1358" y2="193.1358"/><polygon fill="#46565D" points="353.8378,183.1358,357.8378,193.1358