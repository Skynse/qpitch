<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1640px" preserveAspectRatio="none" style="width:912px;height:1640px;background:#FFFFFF;" version="1.1" viewBox="0 0 912 1640" width="912px" zoomAndPan="magnify"><rect width="100%" height="100%" fill="#ffffff"/><title>QPitch 2.0 &#8212; audio and pitch-control paths</title><defs/><g><g class="title" data-source-line="2"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="297.4288" x="306.1846" y="34.9659">QPitch 2.0 &#8212; audio and pitch-control paths</text></g><ellipse cx="379.5818" cy="60.0679" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#E8F4F4" height="39.0679" rx="12.5" ry="12.5" style="stroke:#477678;stroke-width:0.5;" width="181.0554" x="289.0541" y="90.0679"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="161.0554" x="299.0541" y="115.0339">Host calls processBlock()</text><polygon fill="#E8F4F4" points="289.6951,149.1358,469.4685,149.1358,481.4685,161.1358,469.4685,173.1358,289.6951,173.1358,277.6951,161.1358,289.6951,149.1358" style="stroke:#477678;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="179.7733" x="289.6951" y="166.5678">Empty block or no outputs?</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="21.7419" x="481.4685" y="157.0339">yes</text><ellipse cx="525.2104" cy="161.1358" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="525.2104" cy="161.1358" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><rect fill="#E8F4F4" height="39.0679" rx="12.5" ry="12.5" style="stroke:#477678;stroke-width:0.5;" width="290.0309" x="234.5663" y="193.1358"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="270.0309" x="244.5663" y="218.1018">Read parameters and allowed-note mask</text><rect fill="#E8F4F4" height="39.0679" rx="12.5" ry="12.5" style="stroke:#477678;stroke-width:0.5;" width="237.0691" x="261.0472" y="252.2038"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="217.0691" x="271.0472" y="277.1697">Copy input channels to dryBuffer</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1;" width="739.1636" x="11" y="311.2717"/><rect fill="#E8F4F4" height="58.1358" rx="12.5" ry="12.5" style="stroke:#477678;stroke-width:0.5;" width="240.4711" x="87.9528" y="415.4075"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="220.4711" x="97.9528" y="440.3734">Detect pitch from input channel 0</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="136.1494" x="97.9528" y="459.4414">(YIN and confidence)</text><rect fill="#E8F4F4" height="58.1358" rx="12.5" ry="12.5" style="stroke:#477678;stroke-width:0.5;" width="346.4227" x="34.977" y="493.5433"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="326.4227" x="44.977" y="518.5093">Convert Hz to MIDI; lock the nearest allowed note</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="205.6732" x="44.977" y="537.5772">(switch 15 ct past the midpoint)</text><rect fill="#E8F4F4" height="77.2038" rx="12.5" ry="12.5" style="stroke:#477678;stroke-width:0.5;" width="369.3967" x="23.49" y="579.2131"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="310.2947" x="33.49" y="604.1791">Retune Speed pulls toward the note (slowed on</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="314.6208" x="33.49" y="623.247">held notes by Humanize); Note Transition keeps</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="349.3967" x="33.49" y="642.3149">the sung slide on note changes; T-Pain shortens both</text><rect fill="#E8F4F4" height="58.1358" rx="12.5" ry="12.5" style="stroke:#477678;stroke-width:0.5;" width="370.3767" x="23" y="676.4169"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="261.211" x="33" y="701.3828">Apply tolerance and correction amount;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="350.3767" x="33" y="720.4507">calculate pitch ratio (or hold / relax after loss of pitch)</text><rect fill="#E8F4F4" height="39.0679" rx="12.5" ry="12.5" style="stroke:#477678;stroke-width:0.5;" width="347.4587" x="34.459" y="754.5527"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="327.4587" x="44.459" y="779.5186">Shift the slice; ratio = 1 when correction is inactive</text><rect fill="#E8F4F4" height="58.1358" rx="12.5" ry="12.5" style="stroke:#477678;stroke-width:0.5;" width="204.3933" x="105.9917" y="337.2717"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="184.3933" x="115.9917" y="362.2376">Take the next slice up to the</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="156.9534" x="115.9917" y="381.3055">128-sample control grid</text><polygon fill="#E8F4F4" points="115.1937,813.6206,301.183,813.6206,313.183,825.6206,301.183,837.6206,115.1937,837.6206,103.1937,825.6206,115.1937,813.6206" style="stroke:#477678;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="185.9893" x="115.1937" y="831.0526">More samples in host block?</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="21.7419" x="313.183" y="821.5186">yes</text><rect fill="#E8F4F4" height="39.0679" rx="12.5" ry="12.5" style="stroke:#477678;stroke-width:0.5;" width="290.7869" x="445.3767" y="571.6792"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="270.7869" x="455.3767" y="596.6451">Retain original input for delayed dry path</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1;" width="739.1636" x="11" y="857.6206"/><rect fill="#E8F4F4" height="39.0679" rx="12.5" ry="12.5" style="stroke:#477678;stroke-width:0.5;" width="324.9609" x="217.1014" y="883.6206"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="304.9609" x="227.1014" y="908.5866">Adapt host blocks to fixed Rubber Band blocks</text><rect fill="#E8F4F4" height="58.1358" rx="12.5" ry="12.5" style="stroke:#477678;stroke-width:0.5;" width="308.287" x="225.4383" y="942.6885"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="288.287" x="235.4383" y="967.6545">Delay downward ratios ~38 ms so both shift</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="246.287" x="235.4383" y="986.7224">directions land on the analysed audio</text><rect fill="#E8F4F4" height="58.1358" rx="12.5" ry="12.5" style="stroke:#477678;stroke-width:0.5;" width="249.2351" x="254.9642" y="1020.8244"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="153.2574" x="264.9642" y="1045.7903">Shift channels together</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="229.2351" x="264.9642" y="1064.8582">with selected native formant mode</text><path d="M570.7771,1094.4263 L570.7771,1124.0281 L550.7771,1128.0281 L570.7771,1132.0281 L570.7771,1161.63 A0,0 0 0 0 570.7771,1161.63 L900.798,1161.63 A0,0 0 0 0 900.798,1161.63 L900.798,1104.4263 L890.798,1094.4263 L570.7771,1094.4263 A0,0 0 0 0 570.7771,1094.4263" fill="#F3F9DB" style="stroke:#80934B;stroke-width:0.5;"/><path d="M890.798,1094.4263 L890.798,1104.4263 L900.798,1104.4263 L890.798,1094.4263" fill="#F3F9DB" style="stroke:#80934B;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="309.0208" x="576.7771" y="1114.3922">Correction inactive: host bypass, correction off,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="296.2108" x="576.7771" y="1133.4601">zero correction amount, or no allowed notes.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="275.6589" x="576.7771" y="1152.528">The engine keeps running in either mode.</text><rect fill="#E8F4F4" height="58.1358" rx="12.5" ry="12.5" style="stroke:#477678;stroke-width:0.5;" width="342.3907" x="208.3865" y="1098.9602"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="322.3907" x="218.3865" y="1123.9261">Crossfade shifted audio and latency-matched dry</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="200.7312" x="218.3865" y="1142.9941">(5 ms fade; wet target = 1 or 0)</text><rect fill="#E8F4F4" height="39.0679" rx="12.5" ry="12.5" style="stroke:#477678;stroke-width:0.5;" width="346.4788" x="206.3424" y="1181.63"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="326.4788" x="216.3424" y="1206.5959">Duplicate mono output for mono-to-stereo layout</text><rect fill="#E8F4F4" height="39.0679" rx="12.5" ry="12.5" style="stroke:#477678;stroke-width:0.5;" width="320.5089" x="219.3274" y="1240.6979"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="300.5089" x="229.3274" y="1265.6639">Detect measured output pitch from channel 0</text><rect fill="#E8F4F4" height="39.0679" rx="12.5" ry="12.5" style="stroke:#477678;stroke-width:0.5;" width="330.0148" x="214.5744" y="1299.7658"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="310.0148" x="224.5744" y="1324.7318">Publish input, target and output pitch readouts</text><rect fill="#E8F4F4" height="39.0679" rx="12.5" ry="12.5" style="stroke:#477678;stroke-width:0.5;" width="137.4176" x="310.873" y="1358.8338"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="117.4176" x="320.873" y="1383.7997">Apply output gain</text><rect fill="#E8F4F4" height="39.0679" rx="12.5" ry="12.5" style="stroke:#477678;stroke-width:0.5;" width="155.2675" x="301.9481" y="1417.9017"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="135.2675" x="311.9481" y="1442.8676">Return audio to host</text><ellipse cx="379.5818" cy="1487.9696" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="379.5818" cy="1487.9696" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#46565D;stroke-width:1;" x1="379.5818" x2="379.5818" y1="70.0679" y2="90.0679"/><polygon fill="#46565D" points="375.5818,80.0679,379.5818,90.0679,383.5818,80.0679,379.5818,84.0679" style="stroke:#46565D;stroke-width:1;"/><line style="stroke:#46565D;stroke-width:1;" x1="379.5818" x2="379.5818" y1="173.1358" y2="193.1358"/><polygon fill="#46565D" points="375.5818,183.1358,379.5818,193.1358,383.5818,183.1358,379.5818,187.1358" style="stroke:#46565D;stroke-width:1;"/><line style="stroke:#46565D;stroke-width:1;" x1="481.4685" x2="514.2104" y1="161.1358" y2="161.1358"/><polygon fill="#46565D" points="504.2104,157.1358,514.2104,161.1358,504.2104,165.1358,508.2104,161.1358" style="stroke:#46565D;stroke-width:1;"/><line style="stroke:#46565D;stroke-width:1;" x1="379.5818" x2="379.5818" y1="129.1358" y2="149.1358"/><polygon fill="#46565D" poi