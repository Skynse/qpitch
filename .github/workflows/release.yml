name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v1.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            platform: linux
            os: ubuntu-latest
            configure: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            build: cmake --build build --target QPitch_VST3 QPitch_CLAP --parallel 2
          - name: macOS
            platform: macos-universal
            os: macos-latest
            configure: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
            build: cmake --build build --target QPitch_VST3 QPitch_CLAP --parallel 2
          - name: Windows
            platform: windows
            os: windows-latest
            configure: cmake -S . -B build
            build: cmake --build build --config Release --target QPitch_VST3 QPitch_CLAP --parallel 2

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            pkg-config \
            zip \
            libx11-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxcursor-dev \
            libfreetype-dev \
            libfontconfig1-dev

      - name: Configure
        run: ${{ matrix.configure }}

      - name: Build
        run: ${{ matrix.build }}

      - name: Package Linux/macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${{ inputs.version }}"
          fi

          mkdir -p dist package
          cp -R build/QPitch_artefacts/Release/VST3/QPitch.vst3 package/
          cp -R build/QPitch_artefacts/Release/CLAP/QPitch.clap package/

          (
            cd package
            zip -r "../dist/QPitch-${version}-${{ matrix.platform }}-vst3.zip" QPitch.vst3
            zip -r "../dist/QPitch-${version}-${{ matrix.platform }}-clap.zip" QPitch.clap
          )

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME
          } else {
            $version = "${{ inputs.version }}"
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item -Recurse -Force build/QPitch_artefacts/Release/VST3/QPitch.vst3 package/
          Copy-Item -Recurse -Force build/QPitch_artefacts/Release/CLAP/QPitch.clap package/
          Compress-Archive -Path package/QPitch.vst3 -DestinationPath "dist/QPitch-$version-${{ matrix.platform }}-vst3.zip" -Force
          Compress-Archive -Path package/QPitch.clap -DestinationPath "dist/QPitch-$version-${{ matrix.platform }}-clap.zip" -Force

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qpitch-${{ matrix.platform }}
          path: dist/*.zip

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          name: QPitch ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          files: dist/*.zip
          generate_release_notes: true
