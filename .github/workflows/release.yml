name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v2.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            platform: linux
            os: ubuntu-latest
            configure: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            build: QPITCH_CONTAINER_ENGINE=docker tools/linux/build.sh "$PWD/build"
          - name: macOS
            platform: macos-universal
            os: macos-latest
            configure: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
            build: cmake --build build --target QPitch_VST3 QPitch_CLAP qpitch_shifter_test qpitch_detector_test --parallel 2
          - name: Windows
            platform: windows
            os: windows-latest
            configure: cmake -S . -B build
            build: cmake --build build --config Release --target QPitch_VST3 QPitch_CLAP qpitch_shifter_test qpitch_detector_test --parallel 2

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        if: runner.os != 'Linux'
        run: ${{ matrix.configure }}

      - name: Build
        run: ${{ matrix.build }}

      - name: Test pitch shifting
        if: runner.os != 'Linux'
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Linux/macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${{ inputs.version }}"
          fi

          mkdir -p dist package/licenses
          cp LICENSE THIRD_PARTY_NOTICES.md package/licenses/
          cp third_party/rubberband/COPYING package/licenses/RubberBand-COPYING
          cp third_party/rubberband/COMPILING.md package/licenses/RubberBand-COMPILING.md
          cp -R third_party/rubberband/src/ext package/licenses/RubberBand-ext
          cp -R build/QPitch_artefacts/Release/VST3/QPitch.vst3 package/
          cp -R build/QPitch_artefacts/Release/CLAP/QPitch.clap package/

          (
            cd package
            zip -r "../dist/QPitch-${version}-${{ matrix.platform }}-vst3.zip" QPitch.vst3 licenses
            zip -r "../dist/QPitch-${version}-${{ matrix.platform }}-clap.zip" QPitch.clap licenses
          )

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME
          } else {
            $version = "${{ inputs.version }}"
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          New-Item -ItemType Directory -Force -Path package | Out-Null
          New-Item -ItemType Directory -Force -Path package/licenses | Out-Null
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md package/licenses/
          Copy-Item third_party/rubberband/COPYING package/licenses/RubberBand-COPYING
          Copy-Item third_party/rubberband/COMPILING.md package/licenses/RubberBand-COMPILING.md
          Copy-Item -Recurse third_party/rubberband/src/ext package/licenses/RubberBand-ext
          Copy-Item -Recurse -Force build/QPitch_artefacts/Release/VST3/QPitch.vst3 package/
          Copy-Item -Recurse -Force build/QPitch_artefacts/Release/CLAP/QPitch.clap package/
          Compress-Archive -Path package/QPitch.vst3, package/licenses -DestinationPath "dist/QPitch-$version-${{ matrix.platform }}-vst3.zip" -Force
          Compress-Archive -Path package/QPitch.clap, package/licenses -DestinationPath "dist/QPitch-$version-${{ matrix.platform }}-clap.zip" -Force

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qpitch-${{ matrix.platform }}
          path: dist/*.zip

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          name: QPitch ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          files: dist/*.zip
          generate_release_notes: true
