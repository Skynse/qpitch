name: build

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            configure: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            build: QPITCH_CONTAINER_ENGINE=docker tools/linux/build.sh "$PWD/build"
          - name: macOS
            os: macos-latest
            configure: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
            build: cmake --build build --target QPitch_VST3 QPitch_CLAP qpitch_shifter_test qpitch_detector_test --parallel 2
          - name: Windows
            os: windows-latest
            configure: cmake -S . -B build
            build: cmake --build build --config Release --target QPitch_VST3 QPitch_CLAP qpitch_shifter_test qpitch_detector_test --parallel 2

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        if: runner.os != 'Linux'
        run: ${{ matrix.configure }}

      - name: Build
        run: ${{ matrix.build }}

      - name: Test pitch shifting
        if: runner.os != 'Linux'
        run: ctest --test-dir build -C Release --output-on-failure
